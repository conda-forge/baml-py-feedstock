schema_version: 1

context:
  version: "0.226.2"

package:
  name: baml-py
  version: ${{ version }}

source:
  - url: https://github.com/BoundaryML/baml/archive/refs/tags/${{ version }}.zip
    sha256: a00996108ee98ca8900af321b077aa59db2f9f5da7b2f07371bf7b6be25487b1

build:
  number: 0
  # Upstream builds with pyo3's abi3-py38 feature and every wheel on PyPI is
  # cp38-abi3, so build once at python_min and ship a single artifact per
  # platform that works on python_min and every newer Python.
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}

requirements:
  build:
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin
    - cargo-bundle-licenses
    - perl
    - make
  host:
    - if: is_abi3
      then: python-abi3
    - python
    - pip
    - maturin
  run:
    - python

tests:
  - python:
      imports:
        - baml_py
      pip_check: true
      python_version:
        - if: is_abi3
          then: ${{ python_min }}.*
        - "*"
  - if: is_abi3
    then:
      requirements:
        run:
          - abi3audit
      script:
        - if: unix
          then: abi3audit $SP_DIR/baml_py/baml_py.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit %SP_DIR%\baml_py\baml_py.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
  - script:
      - baml-cli --version
      - baml --help

about:
  homepage: https://github.com/BoundaryML/baml
  summary: BAML is a language that helps you get structured data from LLMs, with the best DX possible.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - moritzwilksch
